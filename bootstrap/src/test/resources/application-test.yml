spring:
  datasource:
    url: jdbc:h2:mem:challa;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

jwt:
  secret: test-only-secret-key-that-is-at-least-32-bytes-long-1234567890

s3:
  bucket: test-challa-bucket
  region: ap-northeast-2
  file-path:
    camera-filters: test-challa/camera-filters.json
    room-cover-stickers: test-challa/cover-stickers.json
    room-sticker-colors: test-challa/sticker-colors.json

oidc:
  kakao:
    client-id: test-kakao-rest-key
    native-client-id: test-kakao-native-key
  apple:
    client-id: test.apple.client.id

social-revoke:
  kakao:
    admin-key: test-kakao-admin-key
  apple:
    client-id: test.apple.client.id
    team-id: TESTTEAMID
    key-id: TESTKEYID
    private-key: ""
